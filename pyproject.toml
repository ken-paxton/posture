[project]
name = "posture-coach"
version = "0.1.0"
description = "Local, private webcam posture coach: personal-baseline posture tracking with MediaPipe."
requires-python = ">=3.10"
dependencies = ["mediapipe>=0.10.20", "opencv-python-headless>=4.9", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
posture-coach = "posture_app.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["posture_app"]

[tool.setuptools.package-data]
posture_app = ["web/*"]
